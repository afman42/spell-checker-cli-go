name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go version
        run: go version

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || (echo "Please run 'go mod tidy' and commit the changes" && exit 1)

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run staticcheck
        run: make staticcheck

      - name: Run tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.txt
          fail_ci_if_error: false

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go version
        run: go version

      - name: Cross-compile binary
        run: make build-cross GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} OUTDIR=./bin

      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          UPX_VERSION="5.2.0"
          wget -q "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          tar -xf "upx-${UPX_VERSION}-amd64_linux.tar.xz"
          mv "upx-${UPX_VERSION}-amd64_linux/upx" ./upx
          rm -rf "upx-${UPX_VERSION}-amd64_linux" "upx-${UPX_VERSION}-amd64_linux.tar.xz"
          chmod +x ./upx

      - name: Compress binary with UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./upx --best ./bin/${{ matrix.goos }}_${{ matrix.goarch }}/spellchecker \
            -o ./bin/${{ matrix.goos }}_${{ matrix.goarch }}/spellchecker-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Name release artifact (non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: |
          mv ./bin/${{ matrix.goos }}_${{ matrix.goarch }}/spellchecker \
             ./bin/${{ matrix.goos }}_${{ matrix.goarch }}/spellchecker-${{ matrix.goos }}-${{ matrix.goarch }}
        shell: bash

      - name: Add .exe extension (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv ./bin/${{ matrix.goos }}_${{ matrix.goarch }}/spellchecker-${{ matrix.goos }}-${{ matrix.goarch }} \
             ./bin/${{ matrix.goos }}_${{ matrix.goarch }}/spellchecker-${{ matrix.goos }}-${{ matrix.goarch }}.exe
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: spellchecker-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.sha }}
          path: ./bin/${{ matrix.goos }}_${{ matrix.goarch }}/spellchecker-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary for integration tests
        run: make build-cross GOOS=linux GOARCH=amd64 OUTDIR=./bin

      - name: Set up test directory
        run: mkdir -p ./tmp/

      - name: Test CLI - Scan directory with default settings
        continue-on-error: true
        run: ./bin/linux_amd64/spellchecker --output "./tmp/scan-a-directory-with-default-settings.txt" ./test/

      - name: Test CLI - Scan a single file
        continue-on-error: true
        run: ./bin/linux_amd64/spellchecker --output "./tmp/scan-a-single-file.txt" ./test/index.md

      - name: Test CLI - Scan with exclusions and verbose output
        continue-on-error: true
        run: ./bin/linux_amd64/spellchecker --exclude "*.pdf,*.tmp,bin/" --output "./tmp/scan-with-exclusions-and-verbose-output.txt" --verbose ./test/

      - name: Test CLI - Use a personal dictionary
        continue-on-error: true
        run: |
          printf "Qopper\nFluxCapacitor\n# This is a comment\nbigcorp-api\nGregor\nSamsa\n" > .project-words.txt
          ./bin/linux_amd64/spellchecker --personal-dict ".project-words.txt" --output "./tmp/use-a-personal-dictionary-to-allow-specific-jargon.txt" ./test/index.md

      - name: Test CLI - Generate single HTML report
        continue-on-error: true
        run: ./bin/linux_amd64/spellchecker --exclude "*.pdf,*.tmp,bin/" --output "./tmp/generate-a-single-HTML-report-file.html" ./test/

      - name: Test CLI - Multi-file HTML reports
        continue-on-error: true
        run: ./bin/linux_amd64/spellchecker --format html --output "./tmp/multi-file-html-reports/" ./test/

      - name: Test CLI - Config file functionality
        continue-on-error: true
        run: |
          cat > spellchecker.yaml << 'EOF'
          exclude:
            - "*.log"
            - "build/"
            - "vendor/"
          personal-dictionary: ".project-words.txt"
          format: "html"
          output: "./tmp/spellcheck-reports/"
          EOF
          ./bin/linux_amd64/spellchecker --verbose ./test/

      - name: Test CLI - Stdin functionality
        continue-on-error: true
        run: |
          # The config-file step above left spellchecker.yaml in the workspace;
          # its format:html/output keys would hijack this stdin run. Remove it
          # so stdin defaults to plain-text output the assertion can grep.
          rm -f spellchecker.yaml
          echo "This is a wondefrul text with some erors" | ./bin/linux_amd64/spellchecker - > ./tmp/stdin-test.txt
          if ! grep -q "wondefrul" ./tmp/stdin-test.txt; then
            echo "Stdin test failed: expected 'wondefrul' not found in output"
            exit 1
          fi

      - name: Test CLI - --only-changed-lines requires --git-diff
        run: |
          set +e
          ./bin/linux_amd64/spellchecker --only-changed-lines ./test/ 2> ./tmp/only-changed-lines-validation.txt
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit 2 for --only-changed-lines without --git-diff, got $code"
            cat ./tmp/only-changed-lines-validation.txt
            exit 1
          fi
          if ! grep -q "only-changed-lines requires --git-diff" ./tmp/only-changed-lines-validation.txt; then
            echo "Expected validation message not found"
            cat ./tmp/only-changed-lines-validation.txt
            exit 1
          fi

      - name: Test CLI - --only-changed-lines hunk filter
        run: |
          tmp=$(mktemp -d)
          cp ./bin/linux_amd64/spellchecker "$tmp/spellchecker"
          cd "$tmp"
          git init -q
          git config user.email "ci@test.com"
          git config user.name "ci"
          printf "teh world\nhello world\n" > a.txt
          git add a.txt
          git commit -qm "init"
          printf "teh world\nteh quick\n" > a.txt
          set +e
          ./spellchecker --git-diff HEAD --verbose . > /tmp/hunk-all-out.txt 2>&1
          ./spellchecker --git-diff HEAD --only-changed-lines --verbose . > /tmp/hunk-filtered-out.txt 2>&1
          set -e
          filtered_count=$(grep -c "appears to be a typo" /tmp/hunk-filtered-out.txt || true)
          all_count=$(grep -c "appears to be a typo" /tmp/hunk-all-out.txt || true)
          echo "filtered=$filtered_count all=$all_count"
          if [ "$filtered_count" -ne 1 ]; then
            echo "Expected 1 typo with --only-changed-lines, got $filtered_count"
            cat /tmp/hunk-filtered-out.txt
            exit 1
          fi
          if [ "$all_count" -ne 2 ]; then
            echo "Expected 2 typos without filter, got $all_count"
            cat /tmp/hunk-all-out.txt
            exit 1
          fi

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./tmp/
